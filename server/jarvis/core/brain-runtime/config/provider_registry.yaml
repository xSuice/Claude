# JARVIS Provider Registry — Phase 2 AP-3
# Deploy target: /opt/jarvis/config/provider_registry.yaml
# Source: server/jarvis/core/brain-runtime/config/provider_registry.yaml
# Schema: each entry must have canonical, family, context_limit, reasoning, quota_bucket

providers:
  kimi-pro:
    canonical: kimi-pro
    family: cloud
    context_limit: 131072
