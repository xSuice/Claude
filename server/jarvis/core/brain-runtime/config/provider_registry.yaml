    quota_bucket: kimi

  nexum-v1:
    canonical: nexum-v1
    family: cloud
    context_limit: 32768
    reasoning: false
    quota_bucket: nexum

  sonnet:
    canonical: sonnet
    family: local
    context_limit: 8192
    reasoning: false
    quota_bucket: local

  claude:
    canonical: claude
    family: cloud
    context_limit: 200000
    reasoning: true
    quota_bucket: claude

  helper:
    canonical: helper
    family: cloud
    context_limit: 8192
    reasoning: false
    quota_bucket: helper

